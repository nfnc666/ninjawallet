# Builds the iOS app in Expo's cloud and shares it on TestFlight.
#
# There is deliberately no `on:` trigger. A workflow without one runs only
# when it is started by hand — from the EAS dashboard in a browser, or with
# `eas workflow:run`. That is what makes it usable without a computer, and it
# means a build never starts by itself: each run costs build quota, and each
# submission puts a binary in front of Apple.
#
# The `testflight` job type, rather than plain `submit`, because it can also
# share the build with internal and external testing groups.
name: TestFlight

jobs:
  build_ios:
    name: Build iOS app
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
